<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilawah — Chamada ao vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --emerald-950:#0a2e2b; --emerald-900:#0f3d3a; --emerald-800:#155450; --emerald-700:#1c6b64;
    --gold-500:#c6a15b; --gold-300:#e0c78a;
    --stone-100:#efe9dc; --stone-50:#f7f4ea;
    --ink-900:#1b1b16; --maroon-600:#8c3b3b; --green-ok:#3a7a5c;
    --line: rgba(198,161,91,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--stone-50); color:var(--ink-900);
    font-family:'Work Sans', sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2,h3{ font-family:'Newsreader', serif; font-weight:500; color:var(--emerald-950); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button, input, select{ font-family:inherit; }
  button{ cursor:pointer; }
  *:focus-visible{ outline:2px solid var(--gold-500); outline-offset:2px; }

  #app{ width:100%; max-width:480px; }

  .card{
    background:#fff; border:1px solid var(--line);
    padding:36px 32px; box-shadow:0 20px 50px -30px rgba(10,46,43,0.4);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--maroon-600); display:flex; align-items:center; gap:8px; margin-bottom:16px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 50%{opacity:0.25;} }

  h1.title{ font-size:1.9rem; margin-bottom:8px; }
  p.sub{ color:#54544a; font-size:0.92rem; line-height:1.55; margin-bottom:26px; }

  label{ display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:#6b6b5f; margin-bottom:6px; margin-top:16px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], select{
    width:100%; padding:12px 14px; border:1px solid var(--line); background:var(--stone-50);
    font-size:0.95rem; color:var(--ink-900);
  }
  input[type=text]:focus, select:focus{ background:#fff; border-color:var(--gold-500); }

  .role-toggle{ display:flex; gap:10px; margin-top:6px; }
  .role-opt{
    flex:1; padding:12px; text-align:center; border:1px solid var(--line); font-size:0.85rem;
    color:var(--emerald-900); background:var(--stone-50); transition:all .15s;
  }
  .role-opt.active{ background:var(--emerald-950); color:var(--stone-50); border-color:var(--emerald-950); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; width:100%; border:none; font-size:0.92rem; font-weight:600;
    letter-spacing:0.01em; margin-top:24px; transition:background .2s, transform .15s;
  }
  .btn-primary{ background:var(--emerald-900); color:var(--stone-50); }
  .btn-primary:hover{ background:var(--emerald-800); transform:translateY(-1px); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-danger{ background:var(--maroon-600); color:#fff; }
  .btn-danger:hover{ background:#733030; }
  .btn-gold{ background:var(--gold-500); color:var(--emerald-950); }
  .btn-gold:hover{ background:var(--gold-300); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--emerald-900); }

  .err{ color:var(--maroon-600); font-size:0.82rem; margin-top:10px; min-height:1em; }
  .hint{ color:#8a8a7d; font-size:0.78rem; margin-top:14px; line-height:1.5; }
  .sync-banner{
    background:#fbeeee; border:1px solid rgba(140,59,59,0.3); color:var(--maroon-600);
    font-size:0.8rem; padding:10px 14px; margin-bottom:18px; display:flex; align-items:center; gap:8px;
  }
  .sync-banner .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }

  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  .me{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--gold-500),var(--emerald-700));
    display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:600; color:var(--emerald-950);
    font-size:0.95rem;
  }
  .me-name{ font-size:0.9rem; font-weight:600; color:var(--emerald-950); }
  .me-role{ font-size:0.72rem; color:#8a8a7d; text-transform:uppercase; letter-spacing:0.04em; }
  .logout{ font-size:0.78rem; color:#8a8a7d; text-decoration:underline; background:none; border:none; padding:0; width:auto; margin:0;}

  .list{ display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); }
  .row{ background:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row-user{ display:flex; align-items:center; gap:12px; min-width:0; }
  .row-name{ font-size:0.92rem; font-weight:600; color:var(--emerald-950); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-meta{ font-size:0.72rem; color:#8a8a7d; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--green-ok); flex-shrink:0; animation:blink 1.6s ease-in-out infinite; }
  .call-btn{ padding:8px 16px; font-size:0.78rem; margin:0; width:auto; flex-shrink:0; }
  .empty{ text-align:center; padding:40px 20px; color:#8a8a7d; font-size:0.88rem; }

  .call-screen{ text-align:center; }
  .call-avatar-lg{
    width:88px; height:88px; border-radius:50%; margin:0 auto 20px;
    background:linear-gradient(135deg,var(--gold-500),var(--emerald-700));
    display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:600;
    font-size:2rem; color:var(--emerald-950);
    position:relative;
  }
  .ring{ position:absolute; inset:-10px; border:1.5px solid var(--gold-500); border-radius:50%; animation:ringpulse 1.8s ease-out infinite; }
  .ring.d2{ animation-delay:0.6s; }
  @keyframes ringpulse{ 0%{ opacity:0.6; transform:scale(0.9);} 100%{ opacity:0; transform:scale(1.4);} }
  @media (prefers-reduced-motion: reduce){ .ring{ animation:none; opacity:0; } }

  .call-status-label{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--maroon-600); margin-bottom:6px; }
  .call-status-label.ok{ color:var(--green-ok); }
  .call-timer{ font-family:'IBM Plex Mono',monospace; font-size:2.2rem; color:var(--emerald-950); margin:16px 0 6px; }
  .call-cost{ font-size:0.88rem; color:#54544a; margin-bottom:26px; }
  .call-cost b{ font-family:'IBM Plex Mono',monospace; color:var(--emerald-950); }
  .waveform{ display:flex; align-items:flex-end; justify-content:center; gap:3px; height:32px; margin-bottom:24px; }
  .waveform span{ width:4px; background:var(--gold-500); border-radius:1px; animation:wave 1.1s ease-in-out infinite; }
  @keyframes wave{ 0%,100%{ height:20%;} 50%{ height:100%;} }
  .call-actions{ display:flex; gap:12px; }
  .call-actions .btn{ margin-top:0; }

  .summary-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--line); font-size:0.88rem; }
  .summary-row:last-of-type{ border-bottom:none; }
  .summary-total{ display:flex; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-family:'Newsreader',serif; font-size:1.4rem; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Tilawah — real login + real WebRTC audio calls between users
   Signaling now runs on Supabase (Postgres + Realtime) instead of
   the Claude-artifact-only window.storage, so this works as a
   standalone site (e.g. on Vercel).
   ============================================================ */
(function(){

function showFatalError(msg){
  var el = document.getElementById('app');
  el.innerHTML = '';
  var card = document.createElement('div');
  card.className = 'card';
  card.style.textAlign = 'center';
  card.innerHTML =
    '<h2 style="margin-bottom:10px;">Não foi possível carregar a aplicação</h2>' +
    '<p class="sub" style="margin-bottom:22px;">' + msg + '</p>';
  var btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.textContent = 'Recarregar página';
  btn.addEventListener('click', function(){ location.reload(); });
  card.appendChild(btn);
  el.appendChild(card);
}

if (typeof window.supabase === 'undefined') {
  showFatalError('Um recurso necessário não carregou — pode ser a ligação à internet, um bloqueador de anúncios/rastreadores, ou uma rede que bloqueia CDNs externos. Tente recarregar a página, ou mudar de rede/Wi-Fi.');
  return;
}

try {

const SUPABASE_URL = 'https://detgptwdgqpoppkfdazo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRldGdwdHdkZ3Fwb3Bwa2ZkYXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjA5OTYsImV4cCI6MjEwMjMzNjk5Nn0.cdbsNIQ426otrM9JNK7rWCaDuP1myKA3Q93YvGORaN4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// STUN alone only tells each side its own public address — it doesn't help
// when a direct connection can't be made at all (symmetric NAT, some mobile
// networks, corporate firewalls). TURN relays the actual audio in that case.
// These Open Relay Project credentials are a shared public demo pool: free,
// no signup, but not guaranteed — they can be rate-limited or unreliable
// under load. Good as a stronger fallback than STUN-only; not a substitute
// for a real account (Metered, ExpressTURN, Xirsys) if this needs to be
// dependable for real use.
const STUN_SERVERS = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
] };
const PRESENCE_TIMEOUT_MS = 15000;
const HEARTBEAT_MS = 5000;
const DIRECTORY_REFRESH_MS = 4000;

let state = {
  screen: 'login',
  me: null,
  loginName: '', loginRole: 'aluno', loginRate: '', loginErr: '',
  directory: [],
  incomingCall: null,
  activeCall: null,
  pc: null, localStream: null, remoteStream: null,
  callStatus: 'idle',
  callStart: null, callSeconds: 0, callTimerHandle: null,
  lastSummary: null,
  intervals: {},
  channels: {},
  syncIssue: false,
  micChecked: false,
};

function uid(){ return 'u_' + Math.random().toString(36).slice(2, 10); }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
function fmtTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return m+':'+s;
}
function fmtMoney(v){ return '€' + v.toFixed(2).replace('.', ','); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function sbCall(fn, label, attempts = 3, baseDelay = 600){
  let lastErr = null;
  for(let i = 0; i < attempts; i++){
    try{
      const { data, error } = await fn();
      if(!error) return data;
      lastErr = error;
    }catch(e){ lastErr = e; }
    if(i < attempts - 1) await sleep(baseDelay * (i + 1) + Math.random()*250);
  }
  console.error('supabase '+label+' failed:', lastErr && lastErr.message ? lastErr.message : lastErr);
  syncIssue(true);
  return null;
}

let syncIssueTimer = null;
function syncIssue(hasIssue){
  state.syncIssue = hasIssue;
  if(hasIssue){
    if(syncIssueTimer) clearTimeout(syncIssueTimer);
    syncIssueTimer = setTimeout(() => { state.syncIssue = false; if(state.screen!=='login') render(); }, 8000);
  }
  if(state.screen !== 'login') render();
}

let storageHealthy = null;
async function checkStorageHealth(){
  try{
    const { error } = await sb.from('presence').select('id').limit(1);
    storageHealthy = !error;
  }catch(e){ storageHealthy = false; }
  return storageHealthy;
}

// render() used to clear #app first and only then build the new screen —
// if building that screen threw for any reason, the page was left blank
// with nothing recoverable on it. This happened in practice: an incoming
// call arriving would sometimes throw while the "incoming" screen was
// being built, and the person saw a blank page with no way to answer.
// Now a failure here shows a real error with a way back, never blank.
function render(){
  const el = document.getElementById('app');
  let built;
  try{
    built = views[state.screen]();
  }catch(e){
    console.error('Tilawah render error on screen "'+state.screen+'":', e);
    el.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card call-screen';
    card.innerHTML = '<h2 style="margin-bottom:10px;">Ocorreu um problema a mostrar este ecrã</h2>' +
      '<p class="sub" style="margin-bottom:22px;">' + (e && e.message ? e.message : 'Erro desconhecido') + '</p>';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn btn-primary';
    backBtn.textContent = state.me ? 'Voltar à lista' : 'Recomeçar';
    backBtn.addEventListener('click', () => {
      state.incomingCall = null; state.activeCall = null;
      state.screen = state.me ? 'directory' : 'login';
      render();
    });
    card.appendChild(backBtn);
    el.appendChild(card);
    return;
  }
  el.innerHTML = '';
  el.appendChild(built);
}

function h(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(k === 'text'){ node.textContent = attrs[k]; }
    else if(k.startsWith('on')){ node.addEventListener(k.slice(2), attrs[k]); }
    else if(k === 'class'){ node.className = attrs[k]; }
    else if(k === 'html'){ node.innerHTML = attrs[k]; }
    else { node.setAttribute(k, attrs[k]); }
  }
  (children||[]).forEach(c => { if(c) node.appendChild(c); });
  return node;
}

/* ---------------- LOGIN ---------------- */

function LoginView(){
  const card = h('div', { class:'card' }, [
    h('div', { class:'eyebrow' }, [ h('span', { class:'dot' }), h('span', { text:'Entrar na plataforma' }) ]),
    h('h1', { class:'title', text:'Tilawah' }),
    h('p', { class:'sub', text:'Identifique-se para ver quem está online agora e ligar. Cada nome cria uma sessão real — dois dispositivos diferentes conseguem encontrar-se e falar por voz.' }),
  ]);

  if(storageHealthy === false){
    card.appendChild(h('div', { class:'sync-banner', style:'margin-bottom:22px;' }, [
      h('span', { class:'dot' }),
      h('span', { text:'Não foi possível ligar à base de dados agora. Tente novamente daqui a pouco.' }),
    ]));
    const retryBtn = h('button', { class:'btn btn-ghost', text:'Testar novamente' });
    retryBtn.addEventListener('click', async () => {
      retryBtn.disabled = true; retryBtn.textContent = 'A testar…';
      await checkStorageHealth();
      render();
    });
    card.appendChild(retryBtn);
    return card;
  }

  if(storageHealthy === null){
    card.appendChild(h('div', { class:'hint', text:'A verificar ligação à base de dados…' }));
    return card;
  }

  const nameLabel = h('label', { text:'O seu nome' });
  const nameInput = h('input', { type:'text', placeholder:'ex.: Yusuf Rahman', value: state.loginName });
  nameInput.addEventListener('input', e => state.loginName = e.target.value);

  const roleLabel = h('label', { text:'Entra como' });
  const roleToggle = h('div', { class:'role-toggle' }, [
    h('button', { class:'role-opt' + (state.loginRole==='aluno' ? ' active':''), text:'Aluno / Recitador', onclick:(e)=>{ e.preventDefault(); state.loginRole='aluno'; render(); } }),
    h('button', { class:'role-opt' + (state.loginRole==='qari' ? ' active':''), text:'Qari / Professor', onclick:(e)=>{ e.preventDefault(); state.loginRole='qari'; render(); } }),
  ]);

  let rateBlock = null;
  if(state.loginRole === 'qari'){
    rateBlock = h('div', {}, [
      h('label', { text:'A sua tarifa por minuto (€)' }),
      (()=>{ const i = h('input', { type:'text', placeholder:'ex.: 0.45', value: state.loginRate });
             i.addEventListener('input', e => state.loginRate = e.target.value); return i; })(),
    ]);
  }

  const err = h('div', { class:'err', text: state.loginErr });

  const micLabel = h('label', { text:'Microfone' });
  const micRow = h('div', { style:'display:flex; align-items:center; gap:10px;' });
  const micBtn = h('button', { class:'btn btn-ghost', text: state.micChecked ? 'Microfone autorizado ✓' : 'Testar microfone', style:'margin:0; width:auto; padding:10px 16px;' });
  micBtn.addEventListener('click', () => testMicPermission(micBtn));
  micRow.appendChild(micBtn);
  card.appendChild(micLabel);
  card.appendChild(micRow);
  card.appendChild(h('div', { class:'hint', text: isAndroid() ? 'No Android, o pedido de permissão só aparece uma vez por site — se recusar sem querer, tem de a ativar manualmente nas definições do telemóvel.' : 'Confirme já a permissão do microfone, antes de tentar uma chamada.' }));

  const submitBtn = h('button', { class:'btn btn-primary', text:'Entrar' });
  submitBtn.addEventListener('click', async () => {
    const name = state.loginName.trim();
    if(!name){ state.loginErr = 'Escreva o seu nome para continuar.'; render(); return; }
    let rate = 0;
    if(state.loginRole === 'qari'){
      const parsed = parseFloat((state.loginRate||'').replace(',', '.'));
      if(isNaN(parsed) || parsed < 0){ state.loginErr = 'Indique uma tarifa válida, ex.: 0.45'; render(); return; }
      rate = parsed;
    }
    submitBtn.disabled = true; submitBtn.textContent = 'A entrar…';
    state.loginErr = '';
    const me = { id: uid(), name, role: state.loginRole, rate };
    const saved = await sbCall(() => sb.from('presence').upsert({ id: me.id, name: me.name, role: me.role, rate: me.rate, last_seen: new Date().toISOString() }).select(), 'presence upsert');
    if(saved === null){
      state.loginErr = 'Não foi possível ligar à base de dados agora. Tente novamente em alguns segundos.';
      submitBtn.disabled = false; submitBtn.textContent = 'Entrar';
      render();
      return;
    }
    state.me = me;
    state.screen = 'directory';
    startHeartbeat();
    startDirectoryRefresh();
    subscribeIncomingCalls();
    render();
  });

  const hint = h('div', { class:'hint', text:'A sua presença e as chamadas ficam visíveis a quem também estiver a usar esta página — é assim que dois utilizadores conseguem encontrar-se para ligar.' });

  card.appendChild(nameLabel); card.appendChild(nameInput);
  card.appendChild(roleLabel); card.appendChild(roleToggle);
  if(rateBlock) card.appendChild(rateBlock);
  card.appendChild(err);
  card.appendChild(submitBtn);
  card.appendChild(hint);
  return card;
}

/* ---------------- DIRECTORY ---------------- */

function DirectoryView(){
  const wrap = h('div', { class:'card' });

  const topbar = h('div', { class:'topbar' }, [
    h('div', { class:'me' }, [
      h('div', { class:'avatar', text: initials(state.me.name) }),
      h('div', {}, [
        h('div', { class:'me-name', text: state.me.name }),
        h('div', { class:'me-role', text: state.me.role==='qari' ? ('Qari · '+fmtMoney(state.me.rate)+'/min') : 'Aluno' }),
      ]),
    ]),
    h('button', { class:'logout', text:'Sair', onclick: logout }),
  ]);

  if(state.syncIssue){
    wrap.appendChild(h('div', { class:'sync-banner' }, [
      h('span', { class:'dot' }),
      h('span', { text:'Sincronização instável neste momento — a tentar novamente em segundo plano.' }),
    ]));
  }

  wrap.appendChild(h('div', { class:'eyebrow' }, [ h('span', { class:'dot' }), h('span', { text: state.directory.length + ' online agora' }) ]));
  wrap.appendChild(h('h2', { text:'Quem está disponível' }));
  wrap.appendChild(h('p', { class:'sub', text:'Escolha alguém para ligar. A chamada só começa a contar quando a pessoa atender.' }));

  wrap.insertBefore(topbar, wrap.firstChild);

  if(state.directory.length === 0){
    wrap.appendChild(h('div', { class:'empty', text:'Ninguém mais está online neste momento. Abra esta mesma página noutro dispositivo ou aba para testar uma chamada real.' }));
  } else {
    const list = h('div', { class:'list' });
    state.directory.forEach(u => {
      const row = h('div', { class:'row' }, [
        h('div', { class:'row-user' }, [
          h('span', { class:'status-dot' }),
          h('div', { class:'avatar', text: initials(u.name) }),
          h('div', {}, [
            h('div', { class:'row-name', text: u.name }),
            h('div', { class:'row-meta', text: u.role==='qari' ? ('Qari · '+fmtMoney(u.rate)+'/min') : 'Aluno' }),
          ]),
        ]),
      ]);
      const btn = h('button', { class:'btn btn-primary call-btn', text:'Ligar' });
      btn.addEventListener('click', () => startCall(u));
      row.appendChild(btn);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }

  return wrap;
}

async function logout(){
  stopEverything();
  if(state.me) await sbCall(() => sb.from('presence').delete().eq('id', state.me.id), 'presence delete');
  state = { ...state, screen:'login', me:null, loginErr:'', directory:[] };
  render();
}

/* ---------------- CALL SCREENS ---------------- */

function OutgoingView(){
  const c = state.activeCall;
  if(!c){ state.screen = 'directory'; return DirectoryView(); }
  const card = h('div', { class:'card call-screen' });
  card.appendChild(h('div', { class:'call-avatar-lg', text: initials(c.peerName) }, [
    h('div', { class:'ring' }), h('div', { class:'ring d2' }),
  ]));
  card.appendChild(h('div', { class:'call-status-label', text:'A chamar…' }));
  card.appendChild(h('h2', { text: c.peerName }));
  card.appendChild(h('p', { class:'sub', text: c.peerRate > 0 ? ('Tarifa: '+fmtMoney(c.peerRate)+'/min · o relógio só começa quando atender') : 'Chamada gratuita entre alunos' }));
  const cancelBtn = h('button', { class:'btn btn-danger', text:'Cancelar chamada' });
  cancelBtn.addEventListener('click', () => endCall());
  card.appendChild(cancelBtn);
  return card;
}

function IncomingView(){
  const c = state.incomingCall;
  if(!c){ state.screen = 'directory'; return DirectoryView(); }
  const card = h('div', { class:'card call-screen' });
  card.appendChild(h('div', { class:'call-avatar-lg', text: initials(c.caller_name) }, [
    h('div', { class:'ring' }), h('div', { class:'ring d2' }),
  ]));
  card.appendChild(h('div', { class:'call-status-label', text:'Chamada a receber' }));
  card.appendChild(h('h2', { text: c.caller_name || 'Alguém' }));
  card.appendChild(h('p', { class:'sub', text:'Quer recitar consigo agora, por voz.' }));
  const actions = h('div', { class:'call-actions' });
  const rejectBtn = h('button', { class:'btn btn-danger', text:'Recusar' });
  rejectBtn.addEventListener('click', rejectIncomingCall);
  const acceptBtn = h('button', { class:'btn btn-gold', text:'Atender' });
  acceptBtn.addEventListener('click', acceptIncomingCall);
  actions.appendChild(rejectBtn); actions.appendChild(acceptBtn);
  card.appendChild(actions);
  return card;
}

function InCallView(){
  const c = state.activeCall;
  if(!c){ state.screen = 'directory'; return DirectoryView(); }
  const card = h('div', { class:'card call-screen' });
  card.appendChild(h('div', { class:'call-avatar-lg', text: initials(c.peerName) }));
  const statusOk = state.callStatus === 'connected';
  card.appendChild(h('div', { class:'call-status-label' + (statusOk?' ok':''), text: statusOk ? 'Em chamada' : 'A ligar áudio…' }));
  card.appendChild(h('h2', { text: c.peerName }));

  const wf = h('div', { class:'waveform' });
  for(let i=0;i<10;i++) wf.appendChild(h('span', { style: `animation-delay:${(i*0.09).toFixed(2)}s; height:${20+Math.random()*30}%` }));
  card.appendChild(wf);

  card.appendChild(h('div', { class:'call-timer', text: fmtTime(state.callSeconds) }));

  const rate = c.peerRate || 0;
  const cost = (state.callSeconds/60) * rate;
  card.appendChild(h('div', { class:'call-cost', html: rate > 0
    ? `Custo acumulado: <b>${fmtMoney(cost)}</b> · ${fmtMoney(rate)}/min`
    : `Chamada gratuita entre alunos` }));

  const endBtn = h('button', { class:'btn btn-danger', text:'Encerrar chamada' });
  endBtn.addEventListener('click', () => endCall());
  card.appendChild(endBtn);

  const audio = h('audio', { id:'remoteAudioEl', autoplay:'true' });
  audio.style.display='none';
  card.appendChild(audio);
  if(state.remoteStream){ audio.srcObject = state.remoteStream; }

  return card;
}

function SummaryView(){
  const s = state.lastSummary;
  if(!s){ state.screen = 'directory'; return DirectoryView(); }
  const card = h('div', { class:'card call-screen' });
  card.appendChild(h('div', { class:'call-status-label ok', text:'Chamada terminada' }));
  card.appendChild(h('h2', { text: s.peerName }));
  const box = h('div', { style:'text-align:left; margin-top:20px;' });
  box.appendChild(h('div', { class:'summary-row' }, [ h('span', {text:'Duração'}), h('b', {class:'mono', text: fmtTime(s.seconds)}) ]));
  box.appendChild(h('div', { class:'summary-row' }, [ h('span', {text:'Tarifa'}), h('b', {class:'mono', text: s.rate>0 ? fmtMoney(s.rate)+'/min' : 'gratuita'}) ]));
  box.appendChild(h('div', { class:'summary-total' }, [ h('span', {text:'Total'}), h('span', {text: fmtMoney(s.cost)}) ]));
  card.appendChild(box);
  const backBtn = h('button', { class:'btn btn-primary', text:'Voltar à lista' });
  backBtn.addEventListener('click', () => { state.screen='directory'; render(); });
  card.appendChild(backBtn);
  return card;
}

function ErrorView(){
  const card = h('div', { class:'card call-screen' });
  card.appendChild(h('h2', { text:'Não foi possível ligar o microfone' }));
  card.appendChild(h('p', { class:'sub', text: state.errMsg || 'Verifique as permissões de microfone do navegador e tente novamente.' }));
  const backBtn = h('button', { class:'btn btn-primary', text:'Voltar' });
  backBtn.addEventListener('click', () => { state.screen='directory'; render(); });
  card.appendChild(backBtn);
  return card;
}

const views = {
  login: LoginView, directory: DirectoryView, outgoing: OutgoingView,
  incoming: IncomingView, 'in-call': InCallView, summary: SummaryView, error: ErrorView,
};

/* ---------------- PRESENCE (heartbeat + directory) ---------------- */

function startHeartbeat(){
  state.intervals.heartbeat = setInterval(async () => {
    if(!state.me) return;
    await sbCall(() => sb.from('presence').upsert({ id: state.me.id, name: state.me.name, role: state.me.role, rate: state.me.rate, last_seen: new Date().toISOString() }).select(), 'heartbeat');
  }, HEARTBEAT_MS);
}

async function fetchDirectory(){
  if(!state.me) return;
  const rows = await sbCall(() => sb.from('presence').select('*').neq('id', state.me.id), 'directory fetch');
  if(rows === null) return;
  const now = Date.now();
  state.directory = rows.filter(u => now - new Date(u.last_seen).getTime() < PRESENCE_TIMEOUT_MS);
  if(state.screen === 'directory') render();
}

function startDirectoryRefresh(){
  fetchDirectory();
  state.intervals.directory = setInterval(fetchDirectory, DIRECTORY_REFRESH_MS);
  state.channels.presence = sb.channel('presence-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'presence' }, () => fetchDirectory())
    .subscribe();
}

// Realtime callbacks run on their own, later, outside of any try/catch
// that wrapped the original synchronous script execution — an exception
// thrown in here previously had nowhere to land except the browser
// console, while render() had already wiped #app. Wrapping the body and
// funnelling failures through render()'s own error handling (which now
// never leaves a blank page) closes that gap.
function subscribeIncomingCalls(){
  state.channels.incoming = sb.channel('incoming-calls-' + state.me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: 'callee_id=eq.' + state.me.id }, (payload) => {
      try{
        if(state.activeCall) return;
        const row = payload.new;
        if(!row || row.status !== 'ringing') return;
        state.incomingCall = row;
        state.screen = 'incoming';
        render();
      }catch(e){
        console.error('Tilawah incoming-call handler error:', e);
        render();
      }
    })
    .subscribe();
}

/* ---------------- WEBRTC CALL LOGIC ---------------- */

function isAndroid(){ return /Android/i.test(navigator.userAgent); }

function micErrorMessage(e){
  const name = e && e.name;
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    if(isAndroid()){
      return 'A permissão do microfone está bloqueada. No Android, isto não volta a perguntar sozinho — tem de ativar manualmente: toque no ícone de cadeado/informações junto ao endereço, ou vá a Definições do telemóvel → Apps → (o navegador ou a app Claude) → Permissões → Microfone, e ative. Depois volte aqui e tente novamente.';
    }
    return 'A permissão do microfone foi recusada. Ative-a nas definições do navegador para este site e tente novamente.';
  }
  if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){ return 'Não foi encontrado nenhum microfone neste dispositivo.'; }
  if(name === 'NotReadableError'){ return 'O microfone está a ser usado por outra aplicação neste momento.'; }
  return 'O navegador não conseguiu aceder ao microfone (' + (e && e.message ? e.message : name) + ').';
}

async function testMicPermission(button){
  button.disabled = true; const original = button.textContent; button.textContent = 'A pedir permissão…';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    stream.getTracks().forEach(t => t.stop());
    state.micChecked = true;
    button.textContent = 'Microfone autorizado ✓';
    setTimeout(() => render(), 900);
  }catch(e){
    button.disabled = false; button.textContent = original;
    state.errMsg = micErrorMessage(e);
    state.screen = 'error';
    render();
  }
}

async function getMic(){
  try{
    return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  }catch(e){
    state.errMsg = micErrorMessage(e);
    state.screen = 'error';
    render();
    return null;
  }
}

function newPeerConnection(){ return new RTCPeerConnection(STUN_SERVERS); }

function subscribeCallRow(callId, onUpdate){
  return sb.channel('call-' + callId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: 'id=eq.' + callId }, (payload) => {
      try{ onUpdate(payload.new); }
      catch(e){ console.error('Tilawah call-update handler error:', e); render(); }
    })
    .subscribe();
}

function subscribeIceCandidates(callId, fromRole, onCandidate){
  return sb.channel('ice-' + callId + '-' + fromRole)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ice_candidates', filter: 'call_id=eq.' + callId }, (payload) => {
      try{
        if(payload.new.role === fromRole) onCandidate(payload.new.candidate);
      }catch(e){ console.error('Tilawah ice-candidate handler error:', e); }
    })
    .subscribe();
}

async function startCall(peer){
  const stream = await getMic();
  if(!stream) return;
  state.localStream = stream;

  // activeCall must exist *before* this render(), not after — OutgoingView
  // bails back to the directory whenever it's null, so setting screen to
  // 'outgoing' without it first silently undid itself on the first click.
  // A placeholder (id: null, filled in once the DB row exists) fixes that.
  state.activeCall = { id: null, peerId: peer.id, peerName: peer.name, peerRate: peer.rate, role: 'caller' };
  state.callStatus = 'ringing';
  state.screen = 'outgoing';
  render();

  const pc = newPeerConnection();
  state.pc = pc;
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = (ev) => { state.remoteStream = ev.streams[0]; if(state.screen==='in-call') render(); };

  // ICE gathering can start as soon as setLocalDescription runs below, which
  // is before we know the callId these candidates need to be filed under.
  // Buffer anything that arrives early and flush it once the row exists —
  // previously these were dropped silently, which could leave the audio
  // connection without enough candidates to actually connect.
  let callId = null;
  const pendingCandidates = [];
  pc.onicecandidate = (ev) => {
    if(!ev.candidate) return;
    if(callId){
      sbCall(() => sb.from('ice_candidates').insert({ call_id: callId, role: 'caller', candidate: ev.candidate.toJSON() }), 'ice insert (caller)');
    } else {
      pendingCandidates.push(ev.candidate.toJSON());
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const row = await sbCall(() => sb.from('calls').insert({
    caller_id: state.me.id, caller_name: state.me.name, callee_id: peer.id,
    offer, status: 'ringing', rate: peer.rate || 0,
  }).select().single(), 'create call');

  if(!row){ await finishCall(); return; }

  callId = row.id;
  state.activeCall.id = callId;
  render();

  for(const cand of pendingCandidates){
    await sbCall(() => sb.from('ice_candidates').insert({ call_id: callId, role: 'caller', candidate: cand }), 'ice insert (caller, buffered)');
  }

  state.channels.call = subscribeCallRow(callId, async (updated) => {
    if(!state.activeCall || state.activeCall.id !== callId) return;
    if(updated.status === 'rejected'){ await finishCall(); return; }
    if(updated.status === 'ended' && updated.ended_by !== state.me.id){ await finishCall(); return; }
    if(updated.answer && pc.signalingState === 'have-local-offer'){
      await pc.setRemoteDescription(new RTCSessionDescription(updated.answer));
      state.callStatus = 'connecting';
    }
  });

  state.channels.ice = subscribeIceCandidates(callId, 'callee', (candidate) => {
    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
  });

  pc.onconnectionstatechange = () => {
    if(pc.connectionState === 'connected' && state.callStatus !== 'connected'){ enterInCall(); }
    else if(['failed','disconnected','closed'].includes(pc.connectionState) && (state.screen==='in-call' || state.screen==='outgoing')){ connectionFailed(); }
  };

  // Without this, a call that never connects (bad network, no working TURN
  // relay for this pair of networks) just sits on "A chamar…" forever with
  // no explanation — the person has no way to know it's not going to work.
  state.connectTimeout = setTimeout(() => {
    if(state.activeCall && state.activeCall.id === callId && state.callStatus !== 'connected'){ connectionFailed(); }
  }, 25000);
}

async function acceptIncomingCall(){
  const incoming = state.incomingCall;
  if(!incoming){ state.screen = 'directory'; render(); return; }
  const stream = await getMic();
  if(!stream) return;
  state.localStream = stream;

  state.activeCall = { id: incoming.id, peerId: incoming.caller_id, peerName: incoming.caller_name, peerRate: incoming.rate || 0, role: 'callee' };
  state.incomingCall = null;

  const pc = newPeerConnection();
  state.pc = pc;
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = (ev) => { state.remoteStream = ev.streams[0]; if(state.screen==='in-call') render(); };

  pc.onicecandidate = async (ev) => {
    if(ev.candidate){
      await sbCall(() => sb.from('ice_candidates').insert({ call_id: incoming.id, role: 'callee', candidate: ev.candidate.toJSON() }), 'ice insert (callee)');
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(incoming.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await sbCall(() => sb.from('calls').update({ answer, status: 'accepted' }).eq('id', incoming.id), 'accept call');

  state.channels.call = subscribeCallRow(incoming.id, async (updated) => {
    if(!state.activeCall || state.activeCall.id !== incoming.id) return;
    if(updated.status === 'ended' && updated.ended_by !== state.me.id){ await finishCall(); }
  });

  state.channels.ice = subscribeIceCandidates(incoming.id, 'caller', (candidate) => {
    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
  });

  pc.onconnectionstatechange = () => {
    if(pc.connectionState === 'connected' && state.callStatus !== 'connected'){ enterInCall(); }
    else if(['failed','disconnected','closed'].includes(pc.connectionState) && (state.screen==='in-call' || state.screen==='outgoing')){ connectionFailed(); }
  };

  state.connectTimeout = setTimeout(() => {
    if(state.activeCall && state.activeCall.id === incoming.id && state.callStatus !== 'connected'){ connectionFailed(); }
  }, 25000);

  state.screen = 'in-call';
  state.callStatus = 'connecting';
  render();
}

async function rejectIncomingCall(){
  const incoming = state.incomingCall;
  if(incoming) await sbCall(() => sb.from('calls').update({ status: 'rejected' }).eq('id', incoming.id), 'reject call');
  state.incomingCall = null;
  state.screen = 'directory';
  render();
}

function enterInCall(){
  if(state.connectTimeout){ clearTimeout(state.connectTimeout); state.connectTimeout = null; }
  state.callStatus = 'connected';
  state.callStart = Date.now();
  state.callSeconds = 0;
  state.screen = 'in-call';
  render();
  state.callTimerHandle = setInterval(() => {
    state.callSeconds = Math.floor((Date.now() - state.callStart)/1000);
    if(state.screen === 'in-call') render();
  }, 1000);
}

async function endCall(){
  const c = state.activeCall;
  if(c){
    await sbCall(() => sb.from('calls').update({ status: 'ended', ended_by: state.me.id, ended_at: new Date().toISOString() }).eq('id', c.id), 'end call');
  }
  await finishCall();
}

// Called when the audio connection never completes — bad network, or no
// TURN relay that works for this particular pair of networks. Shows an
// explanation instead of silently hanging or silently disconnecting, so
// the person understands *why* nothing happened, not just that it stopped.
async function connectionFailed(){
  const c = state.activeCall;
  if(c){
    await sbCall(() => sb.from('calls').update({ status: 'ended', ended_by: state.me.id, ended_at: new Date().toISOString() }).eq('id', c.id), 'end call (connection failed)').catch(()=>{});
  }
  if(state.connectTimeout){ clearTimeout(state.connectTimeout); state.connectTimeout = null; }
  if(state.channels.call){ sb.removeChannel(state.channels.call); state.channels.call = null; }
  if(state.channels.ice){ sb.removeChannel(state.channels.ice); state.channels.ice = null; }
  if(state.pc){ try{ state.pc.close(); }catch(e){} }
  if(state.localStream){ state.localStream.getTracks().forEach(t=>t.stop()); }
  state.pc = null; state.localStream = null; state.remoteStream = null;
  state.activeCall = null; state.callStatus = 'idle'; state.callSeconds = 0;
  state.errMsg = 'Não foi possível estabelecer a ligação de áudio. Isto costuma acontecer quando as duas redes não conseguem falar diretamente uma com a outra. Tente novamente, idealmente com os dois em Wi-Fi.';
  state.screen = 'error';
  render();
}

async function finishCall(){
  const c = state.activeCall;
  if(state.connectTimeout){ clearTimeout(state.connectTimeout); state.connectTimeout = null; }
  if(state.callTimerHandle) clearInterval(state.callTimerHandle);
  if(state.channels.call){ sb.removeChannel(state.channels.call); state.channels.call = null; }
  if(state.channels.ice){ sb.removeChannel(state.channels.ice); state.channels.ice = null; }
  if(state.pc){ try{ state.pc.close(); }catch(e){} }
  if(state.localStream){ state.localStream.getTracks().forEach(t=>t.stop()); }

  const seconds = state.callSeconds || 0;
  const rate = c ? (c.peerRate||0) : 0;
  const cost = (seconds/60) * rate;

  if(c) await sbCall(() => sb.from('calls').delete().eq('id', c.id), 'cleanup call row').catch(()=>{});

  state.lastSummary = { peerName: c ? c.peerName : '—', seconds, rate, cost };
  state.pc = null; state.localStream = null; state.remoteStream = null;
  state.activeCall = null; state.callStatus = 'idle'; state.callSeconds = 0;
  state.screen = (seconds > 0) ? 'summary' : 'directory';
  render();
}

function stopEverything(){
  Object.values(state.intervals).forEach(clearInterval);
  state.intervals = {};
  if(state.callTimerHandle) clearInterval(state.callTimerHandle);
  Object.values(state.channels).forEach(ch => { if(ch) sb.removeChannel(ch); });
  state.channels = {};
}

window.addEventListener('beforeunload', () => {
  if(state.me){ navigator.sendBeacon && sb.from('presence').delete().eq('id', state.me.id); }
});

(async function boot(){
  render();
  await checkStorageHealth();
  render();
})();

} catch(e) {
  console.error('Tilawah startup error:', e);
  showFatalError('Ocorreu um erro inesperado ao iniciar a aplicação (' + (e && e.message ? e.message : e) + '). Tente recarregar a página.');
}

})();
</script>
